name: Build VixxRpg APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar configuracao
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Baixar projeto do Google Drive
        run: |
          python -m pip install gdown
          gdown "1j6A9FW3eln4uw4eiO_WW4uEbq1wLdlU-" -O VixxRpg.zip

      - name: Extrair projeto
        run: |
          mkdir project
          unzip -q VixxRpg.zip -d project

      
      - name: Verificar arquivos do projeto
        run: |
          echo "=== Arquivos extraidos ==="
          find project -maxdepth 5 -type f | head -200

          echo "=== Pastas do projeto ==="
          find project -maxdepth 3 -type d
          

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VixxRpg-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
