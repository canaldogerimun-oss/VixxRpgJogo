
name: Build VIXX RPG APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar configuracao
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar projeto do Google Drive
        run: |
          python -m pip install --upgrade gdown
          gdown "1j6A9FW3eln4uw4eiO_WW4uEbq1wLdlU-" -O VixxRpg.zip

      - name: Extrair projeto
        run: |
          mkdir -p project
          unzip -q VixxRpg.zip -d project

      - name: Localizar projeto
        run: |
          SETTINGS_FILE=$(find project -name settings.gradle -type f | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Projeto Android nao encontrado"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> $GITHUB_ENV

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VIXX-RPG-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
